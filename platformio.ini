; Honguera Leaf Node - PlatformIO Configuration
; Variants: honguera-lite, honguera-pro

[common]
src_dir     = firmware/honguera
include_dir = firmware/include
lib_dir     = firmware/lib
test_dir    = firmware/test

; Dependency aliases
lib_deps_common =
    bblanchon/ArduinoJson@^6.21.3
    fastled/FastLED@^3.6.0
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit SHT31 Library@^2.2.2
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.9.0

build_flags_common =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    -Wall
    -Wextra
    -Os

; =============================================================
; LEAF AI ORIGINAL (keep for reference)
; =============================================================
[env:leafai-esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
src_dir = firmware/src
include_dir = firmware/include
build_flags = ${build_flags_common}
lib_deps = ${lib_deps_common}
    https://github.com/EnviroDIY/Arduino-SDI-12.git#v2.1.4

; =============================================================
; HONGUERA LITE
; =============================================================
[env:honguera-lite]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
src_dir = firmware/honguera
include_dir = firmware/include
build_flags = ${build_flags_common}
    -DHONGUERA_LITE
lib_deps = ${lib_deps_common}

; =============================================================
; HONGUERA PRO
; =============================================================
[env:honguera-pro]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
src_dir = firmware/honguera
include_dir = firmware/include
build_flags = ${build_flags_common}
    -DHONGUERA_PRO
lib_deps = ${lib_deps_common}
